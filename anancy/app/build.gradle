plugins {
    id 'com.android.application'
}

android {
    namespace 'app.anancy'
    compileSdk 35

    defaultConfig {
        applicationId 'app.anancy'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName anancyVersion
        // A plain Instrumentation, no androidx.test: it only drives the Android Auto media service
        // (src/androidTest/.../AaProbe.java), so it needs nothing beyond the framework.
        testInstrumentationRunner 'app.anancy.AaProbe'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        // Media3 marks some APIs @UnstableApi (lint-error by default); we accept them.
        disable 'UnsafeOptInUsageError'
    }

    androidResources {
        // Play-mode Piper WAV clips must be stored UNCOMPRESSED so SoundPool.load(openFd) works.
        noCompress += 'wav'
    }

    buildTypes {
        debug {
            // default debug signing -> app-debug.apk
        }
    }
}

apply from: rootProject.file('signing.gradle')

dependencies {
    // Own media engine. ExoPlayer's playlist (setMediaItems + shuffle + REPEAT_MODE_ALL) gives
    // shuffle-all + deterministic auto-advance natively -> the Kodi "stuck past EOF" wedge cannot
    // occur. media3-common (MediaItem/Player) comes transitively; we render into a plain
    // SurfaceView so no media3-ui/theme dependency is needed.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // (transitively pins a cached lifecycle-runtime; the template AA classes are gone but the dep stays
    //  to keep the offline build's dependency graph resolvable — it registers no car surface)
    implementation 'androidx.car.app:app:1.4.0'

    // Optional camera-monitor plugin: headless front-cam capture for periodically-updated STILL
    // images (~0.75fps snapshots, NOT a video feed). No camera-view (no preview). LifecycleService
    // lets the capture service be a LifecycleOwner so CameraX can bindToLifecycle(this).
    // kotlin-stdlib-jdk7/8 classes were merged into kotlin-stdlib in 1.8; CameraX pulls an older
    // transitive kotlin-stdlib-jdk7 -> duplicate-class error. Pin via the BOM to align them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    def camerax = '1.4.1'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"          // PreviewView for the QR scanner
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'

    // Camera-based Wi-Fi / connection pairing: encode QR (ZXing) + scan QR (ML Kit barcode, bundled
    // + offline, no Play Services) so nobody types random-hotspot credentials.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Data Layer (phone <-> watch over the Bluetooth companion link): pushes the watch app's update
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // Android Auto MEDIA app (MediaBrowserServiceCompat + MediaSessionCompat) — the surface that
    // actually shows in the car while driving. Used by MediaProbeService (refresh-rate measurement).
    implementation 'androidx.media:media:1.7.0'

    // Unit tests for the pure logic (SyncMath, CommandRouter). JVM tests only — no Android/ExoPlayer
    // needed, so they run fast in CI. testImplementation is resolved solely for the test source set.
    testImplementation 'junit:junit:4.13.2'
}

// ---- Embed the WATCH APK so the phone can push it to the watch over the Data Layer ---------------
// Building :app builds :wear too and drops wear.apk + wear.sha into this module's assets, so an
// `adb install -r` of the phone APK is all it takes: the phone then self-updates the watch (no
// wireless-adb / charger dance). See WearPusher (phone) + WearUpdater (watch).
// Assets: wear.apk (the build), wear.sha (SHA-256 of those bytes — transfer check), wear.id (the
// watch module's SOURCE hash — the update identity; matches BuildConfig.BUILD_ID inside the APK).
def embeddedWear = layout.buildDirectory.dir('embedded-wear')
// A release phone app must carry a release watch app: the Data Layer needs both signed with the same key.
def releaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
tasks.register('embedWearApk', Copy) {
    dependsOn(releaseBuild ? ':wear:assembleRelease' : ':wear:assembleDebug', ':wear:writeWearBuildId')
    from(project(':wear').layout.buildDirectory.file(releaseBuild
            ? "outputs/apk/release/BackSeatTV-wear-${anancyVersion}.apk" : 'outputs/apk/debug/wear-debug.apk')) { rename { 'wear.apk' } }
    from(project(':wear').layout.buildDirectory.file('wear-build-id.txt')) { rename { 'wear.id' } }
    into embeddedWear
    doLast {
        def apk = embeddedWear.get().file('wear.apk').asFile
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(apk.bytes).encodeHex().toString()
        embeddedWear.get().file('wear.sha').asFile.text = sha
    }
}
android.sourceSets.main.assets.srcDir(embeddedWear)
afterEvaluate { tasks.named('preBuild') { dependsOn 'embedWearApk' } }
